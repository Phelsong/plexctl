[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "plexctl"
version = "0.1.0"
description = "Plex metadata management toolkit"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [
    { name = "Josh S Wilkinson", email = "joshswilkinson@pm.me" },
]
dependencies = [
    "plexapi>=4.16",
    "typer>=0.12",
    "rich>=13.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "defusedxml>=0.7",
]

[project.scripts]
plexctl = "plexctl.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["plexctl"]

[tool.ruff]
line-length = 98
target-version = "py312"
src = ["plexctl", "tests"]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "N",      # pep8-naming
    "UP",     # pyupgrade
    "B",      # flake8-bugbear
    "SIM",    # flake8-simplify
    "TCH",    # flake8-type-checking
    "RUF",    # ruff-specific
    "D102",   # missing docstring in public method
    "D103",   # missing docstring in public function
    "PERF",   # perflint
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"]

[tool.mypy]
python_version = "3.12"
strict = true
namespace_packages = true
explicit_package_bases = true
mypy_path = "."

[[tool.mypy.overrides]]
module = "plexapi.*"
ignore_missing_imports = true

[tool.black]
line-length = 98
target_version = ["py312"]

[tool.bandit]
exclude_dirs = ['/.git', '/.vscode', '/.pixi', '__pycache__', '/__pycache__', '/.mypy_cache']
targets = '.'
recursive = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
