[workspace]
authors = ["Josh S Wilkinson <joshswilkinson@pm.me>"]
channels = ["conda-forge"]
name = "plexctl"
platforms = ["linux-64"]
version = "0.1.0"

[tasks]
# Development (run with pixi run -e dev <task>)
dev = {cmd="python -m plexctl", default-environment = "dev"}
lint = {cmd="ruff check plexctl tests", default-environment = "dev"}
sort = {cmd="isort plexctl --py 314", default-environment = "dev"}
format = {cmd="black -C plexctl tests", default-environment = "dev", depends-on = ["sort"]}
typecheck = {cmd="mypy plexctl", default-environment = "dev"}
test = {cmd="pytest tests -v", default-environment = "dev"}
scan = {cmd="bandit plexctl -r", default-environment = "dev"}
pre-commit = {depends-on = ["sort","format","typecheck","test","scan"]}
# CLI entry points
plexctl = "python -m plexctl"
# Install / uninstall symlink
install = "python scripts/install.py install"
uninstall = "python scripts/install.py uninstall"

[dependencies]
python = ">=3.12"

[pypi-dependencies]
plexapi = ">=4.16"
typer = ">=0.12"
rich = ">=13.0"
pydantic = ">=2.0"
pydantic-settings = ">=2.0"
httpx = ">=0.27"
defusedxml = ">=0.7.1, <0.8"
types-defusedxml = ">=0.7.0.20260504, <0.8"

[feature.dev.pypi-dependencies]
black = ">=26.1.0,<27"
ruff = ">=0.8"
mypy = ">=1.0"
pytest = ">=8.0"
pytest-cov = ">=5.0"
bandit = ">=1.9.4,<2"
types-defusedxml = ">=0.7.0.20260504, <0.8"

[environments]
dev = ["dev"]
