[workspace]
authors = ["Josh S Wilkinson <joshswilkinson@pm.me>"]
channels = ["conda-forge"]
name = "plexctl"
platforms = ["linux-64"]
version = "0.1.0"

[tasks]
# Development (run with pixi run -e dev <task>)
dev = "python -m plexctl"
lint = "ruff check plexctl tests"
format = "black -Cx plexctl tests"
typecheck = "mypy plexctl"
test = "pytest tests -v"
# CLI entry points
plexctl = "python -m plexctl"
# Install / uninstall symlink
install = "python scripts/install.py install"
uninstall = "python scripts/install.py uninstall"

[dependencies]
python = ">=3.12"

[pypi-dependencies]
plexapi = ">=4.16"
typer = ">=0.12"
rich = ">=13.0"
pydantic = ">=2.0"
pydantic-settings = ">=2.0"
httpx = ">=0.27"

[feature.dev.pypi-dependencies]
black = ">=26.1.0,<27"
ruff = ">=0.8"
mypy = ">=1.0"
pytest = ">=8.0"
pytest-cov = ">=5.0"

[environments]
dev = ["dev"]
